name: Terragrunt Plan

on:
  pull_request:
    branches:
      - "main"

jobs:
  generate-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/generate-matrix.yaml

  terraform-plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    needs: generate-matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Terraform Version
        id: tf_version
        run: |
          echo "value=$(cat .terraform-version)" >>"$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ steps.tf_version.outputs.value }}

      - name: Check HCL formatting
        uses: gruntwork-io/terragrunt-action@ad66bd184abd991249047d1f61bce1f29aaed2a6 # v3.3.0
        with:
          tg_command: "hcl fmt --check --diff"

      # NOTE: Do not specify permissions for this GitHub App token since we want all permissions granted to this app.
      - name: Generate GitHub App token for GitHub authentication
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: generate-token-auth
        with:
          app-id: ${{ vars.NETEYE_MANAGER_APP_ID }}
          private-key: ${{ secrets.NETEYE_MANAGER_APP_PRIVATE_KEY }}

      - name: Generate GitHub App token for commenting on PRs
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: generate-token-comment
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terragrunt Plan
        uses: gruntwork-io/terragrunt-action@ad66bd184abd991249047d1f61bce1f29aaed2a6 # v3.3.0
        env:
          GITHUB_TOKEN: ${{ steps.generate-token-comment.outputs.token }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_billing_email: ${{ secrets.BILLING_EMAIL }}
          GITHUB_APP_ID: ${{ vars.NETEYE_MANAGER_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.generate-token-auth.outputs.installation-id }}
          GITHUB_APP_PEM_FILE: ${{ secrets.NETEYE_MANAGER_APP_PRIVATE_KEY }}
          TG_PARALLELISM: 1 # Sequential execution to avoid rate limits
        with:
          github_token: ${{ steps.generate-token-auth.outputs.token }}
          tg_dir: "${{ matrix.unit }}"
          tg_command: "plan"
          tg_comment: 1
