name: Terragrunt Plan

on:
  pull_request:
    branches:
      - "main"

# A new push replaces the plan of the previous one.
concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terragrunt-plan:
    permissions:
      contents: read
    uses: ./.github/workflows/plan-core.yaml
    with:
      # Same as in root.hcl.
      aws_region: eu-south-1
      ssm_prefix: /org-control-plane
      neteye_app_id: ${{ vars.NETEYE_APP_ID }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NETEYE_APP_PRIVATE_KEY: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
