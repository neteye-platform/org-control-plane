name: Terragrunt Plan

on:
  pull_request:
    branches:
      - "main"

# A new push replaces the plan of the previous one.
concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terragrunt-plan:
    permissions:
      contents: read
    uses: ./.github/workflows/plan-core.yaml
    with:
      # Same region as in root.hcl.
      aws_region: eu-south-1
      neteye_app_id: ${{ vars.NETEYE_APP_ID }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NETEYE_APP_PRIVATE_KEY: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}

  terragrunt-plan-status:
    name: Terragrunt Plan Status
    needs: terragrunt-plan
    if: always()
    permissions:
      contents: none
    runs-on: ubuntu-latest
    steps:
      - name: Check plan job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A plan job failed or was cancelled"
            exit 1
          fi
