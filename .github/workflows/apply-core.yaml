name: Terragrunt Apply (Core)

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region of the state bucket and of the SSM parameters"
        type: string
        required: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.25
  TG_NON_INTERACTIVE: "true"

jobs:
  terragrunt-apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      # Terragrunt reads the secrets from SSM Parameter Store, so GitHub does not
      # know them: register every line of the App private key and of the billing
      # email as a secret, so that the logs never show them. The App and
      # installation IDs are not secret, and masking them would hide numbers in
      # the plans. Without anything to mask, the step fails: the configuration
      # changed. The units of a stack are not generated yet, and they include the
      # same root.hcl.
      - name: Mask credentials
        run: |
          set -euo pipefail
          secrets=$(
            terragrunt find --json \
              | jq -r '.[] | select(.type == "unit") | .path' \
              | while IFS= read -r unit; do terragrunt render --format json --working-dir "$unit" </dev/null; done \
              | jq -r '(.terraform.extra_arguments[]?.env_vars.GITHUB_APP_PEM_FILE // empty), (.inputs.billing_email // empty)
                  | split("\n")[] | rtrimstr("\r") | select(length > 0)' \
              | sort -u
          )
          if [ -z "$secrets" ]; then
            echo "::error::No secret to mask: check root.hcl"
            exit 1
          fi
          while IFS= read -r line; do echo "::add-mask::$line"; done <<<"$secrets"

      # All units, in the order of their dependencies (teams before the
      # repositories) and in parallel where possible. Terragrunt generates the
      # stacks first and adds -auto-approve. When a unit fails, the units that
      # depend on it do not run.
      - name: Terragrunt Apply
        run: terragrunt run --all -- apply
