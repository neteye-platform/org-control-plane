name: Terragrunt Apply (Core)

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region of the state bucket and of the SSM parameters"
        type: string
        required: true
      ssm_prefix:
        description: "SSM prefix of the parameters, as in root.hcl"
        type: string
        required: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.25
  TG_NON_INTERACTIVE: "true"

jobs:
  terragrunt-apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      # Every value under the SSM prefix is secret. The comment step also
      # removes the values from the comments.
      - name: Mask credentials
        env:
          SSM_PREFIX: ${{ inputs.ssm_prefix }}
          SECRETS: ${{ runner.temp }}/secrets
        run: |
          set -euo pipefail
          umask 077
          aws ssm get-parameters-by-path --path "$SSM_PREFIX" --recursive --with-decryption \
            --query 'Parameters[].Value' --output json \
            | jq -r '.[] | split("\n")[] | rtrimstr("\r") | select(length > 0)' \
            | sort -u >"$SECRETS"
          if [ ! -s "$SECRETS" ]; then
            echo "::error::No SSM parameter under $SSM_PREFIX"
            exit 1
          fi
          while IFS= read -r line; do echo "::add-mask::$line"; done <"$SECRETS"

      # Teams first, then the categories in parallel. A failed unit stops the
      # units that depend on it.
      - name: Terragrunt Apply
        run: terragrunt run --all -- apply
