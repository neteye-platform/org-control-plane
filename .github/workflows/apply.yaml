name: Terragrunt Apply

on:
  push:
    branches:
      - "main"

# One apply at a time. A newer push replaces a pending run, and it applies
# the latest main, which includes the changes of the replaced run.
concurrency:
  group: terragrunt-apply
  cancel-in-progress: false

jobs:
  terragrunt-apply:
    permissions:
      contents: read
    uses: ./.github/workflows/apply-core.yaml
    with:
      # Same region as in root.hcl.
      aws_region: eu-south-1
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
