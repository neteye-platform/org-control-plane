name: Terragrunt Apply

on:
  push:
    branches:
      - "main"

# One apply at a time. A pending run can be replaced: the newer one applies the latest main.
concurrency:
  group: terragrunt-apply
  cancel-in-progress: false

jobs:
  terragrunt-apply:
    permissions:
      contents: read
    uses: ./.github/workflows/apply-core.yaml
    with:
      # Same as in root.hcl.
      aws_region: eu-south-1
      ssm_prefix: /org-control-plane
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
