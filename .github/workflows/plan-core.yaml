name: Terragrunt Plan (Core)

on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON matrix of Terragrunt units to plan"
        type: string
        required: true
      neteye_manager_app_id:
        description: "GitHub App ID for Terragrunt authentication"
        type: string
        required: true
      neteye_app_id:
        description: "GitHub App ID for PR comments (optional — falls back to the auth token if omitted)"
        type: string
        required: false
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      BILLING_EMAIL:
        required: false
      NETEYE_MANAGER_APP_PRIVATE_KEY:
        required: true
      NETEYE_APP_PRIVATE_KEY:
        required: false

jobs:
  cleanup-plan-comments:
    name: Cleanup old plan comments
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Generate GitHub App token for commenting on PRs
        if: inputs.neteye_app_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token-comment
        with:
          app-id: ${{ inputs.neteye_app_id }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Generate GitHub App token (fallback)
        if: inputs.neteye_app_id == ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token-comment-fallback
        with:
          app-id: ${{ inputs.neteye_manager_app_id }}
          private-key: ${{ secrets.NETEYE_MANAGER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Delete previous plan comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_ID: ${{ inputs.neteye_app_id || inputs.neteye_manager_app_id }}
        with:
          github-token: ${{ steps.generate-token-comment.outputs.token || steps.generate-token-comment-fallback.outputs.token }}
          script: |
            const appId = Number(process.env.APP_ID);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const stale = comments.filter((c) => {
              if (c.performed_via_github_app?.id !== appId) return false;
              const body = c.body.trimStart();
              return body.startsWith('Execution result of "plan"') || body.startsWith('No changes in `');
            });

            core.info(`Found ${stale.length} previous plan comment(s)`);

            for (const c of stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
              });
              core.info(`Deleted comment ${c.id}`);
            }

  terragrunt-plan:
    name: Terragrunt Plan
    needs: cleanup-plan-comments
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get Terraform Version
        id: tf_version
        run: |
          echo "value=$(cat .terraform-version)" >>"$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf_version.outputs.value }}

      - name: Check HCL formatting
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3.4.0
        with:
          tg_command: "hcl fmt --check --diff"

      # NOTE: Do not specify permissions for this GitHub App token since we want all permissions granted to this app.
      - name: Generate GitHub App token for GitHub authentication
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token-auth
        with:
          app-id: ${{ inputs.neteye_manager_app_id }}
          private-key: ${{ secrets.NETEYE_MANAGER_APP_PRIVATE_KEY }}

      - name: Generate GitHub App token for commenting on PRs
        if: inputs.neteye_app_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token-comment
        with:
          app-id: ${{ inputs.neteye_app_id }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terragrunt Plan
        id: plan
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3.4.0
        env:
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_billing_email: ${{ secrets.BILLING_EMAIL }}
          GITHUB_APP_ID: ${{ inputs.neteye_manager_app_id }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.generate-token-auth.outputs.installation-id }}
          GITHUB_APP_PEM_FILE: ${{ secrets.NETEYE_MANAGER_APP_PRIVATE_KEY }}
          TG_PARALLELISM: 1 # Sequential execution to avoid rate limits
        with:
          github_token: ${{ steps.generate-token-auth.outputs.token }}
          tg_dir: "${{ matrix.unit }}"
          tg_command: "plan"
          tg_comment: 0
          tg_output_capture: 1

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.tg_action_output }}
          TG_DIR: ${{ matrix.unit }}
        with:
          github-token: ${{ steps.generate-token-comment.outputs.token || steps.generate-token-auth.outputs.token }}
          script: |
            const raw = process.env.PLAN_OUTPUT;
            const tgDir = process.env.TG_DIR;
            if (!raw) {
              throw new Error('tg_action_output is empty — cannot determine plan result');
            }
            const output = raw.replace(/%25/g, '%').replace(/%0D/g, '\r').replace(/%0A/g, '\n');
            const hasChanges = !output.includes('No changes. Your infrastructure matches the configuration.');
            const body = hasChanges
              ? [
                  `Execution result of "plan" in \`${tgDir}\``,
                  '',
                  '<details>',
                  '<summary>Show output</summary>',
                  '',
                  '```terraform',
                  output,
                  '```',
                  '',
                  '</details>',
                ].join('\n')
              : `No changes in \`${tgDir}\`. Infrastructure matches the configuration.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
