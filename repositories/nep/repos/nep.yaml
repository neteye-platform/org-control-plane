name: nep
description: NetEye Extension Packs
is_template: false
archived: false
template:
  owner: neteye-platform
  repository: default-repository-template
  include_all_branches: false

branch_rulesets:
  main-branch-protection:
    rules:
      required_status_checks:
        required_check:
          - context: "validate-nep-scope"
            integration_id: 15368 # GH Actions
          - context: "TektonCI / nep-build-and-test"
            integration_id: 1112696 # Pipeline As Code

  main-merge-queue-protection:
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 0
        actor_type: OrganizationAdmin
        bypass_mode: pull_request
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      merge_queue:
        merge_method: "SQUASH"
        check_response_timeout_minutes: 120
        max_entries_to_merge: 10
        max_entries_to_build: 10
