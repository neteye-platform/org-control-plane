visibility: public
has_issues: true
has_discussions: false
has_projects: false
has_wiki: false
allow_merge_commit: false
allow_squash_merge: true
allow_rebase_merge: false
allow_auto_merge: false
squash_merge_commit_title: PR_TITLE
squash_merge_commit_message: PR_BODY
delete_branch_on_merge: true
auto_init: false
allow_update_branch: true

branch_ruleset:
  name: "main-branch-protection"
  targets:
    - main
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 5 # Repository admin role
      bypass_mode: pull_request
    - actor_type: OrganizationAdmin
      actor_id: 1
      bypass_mode: pull_request
  restrict_deletions: true
  require_signed_commits: true
  block_force_pushes: true
  copilot_review_on_push: true
  copilot_review_draft_pull_requests: false
  pull_request:
    required_approving_review_count: 1
    dismiss_stale_reviews_on_push: true
    require_last_push_approval: true
    require_code_owner_review: true
    required_review_thread_resolution: true
  require_status_checks:
    strict: true
    checks:
      - "common-pull-request-checks / pre-commit-checks / Pre-commit Checks"
      - "common-pull-request-checks / semgrep-scan / Semgrep Scan"
      - "common-pull-request-checks / trivy-scan / Trivy Config Scan"
      - "common-pull-request-checks / trivy-scan / Trivy FS Scan"
      - "common-pull-request-checks / codeql-scan / CodeQL Scan"
