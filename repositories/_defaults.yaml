visibility: public
has_issues: true
has_discussions: false
has_projects: false
has_wiki: false
allow_merge_commit: false
allow_squash_merge: true
allow_rebase_merge: false
allow_auto_merge: true
merge_commit_title: MERGE_MESSAGE
merge_commit_message: PR_TITLE
squash_merge_commit_title: PR_TITLE
squash_merge_commit_message: COMMIT_MESSAGES
delete_branch_on_merge: true
auto_init: false
allow_update_branch: true

team_access:
  - team: rd-developers
    permission: push

branch_rulesets:
  main-branch-protection:
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 0
        actor_type: OrganizationAdmin
        bypass_mode: pull_request
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
          - "maint-*"
        exclude: []
    rules:
      creation: false
      update: false
      deletion: true
      required_linear_history: true
      required_signatures: true
      pull_request:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        require_last_push_approval: true
        required_review_thread_resolution: true
        allowed_merge_methods:
          - "squash"
      required_status_checks:
        strict_required_status_checks_policy: true
        required_check:
          - context: "common-pull-request-checks / codeql-scan / CodeQL Scan"
            integration_id: 15368 # GH Actions
          - context: "common-pull-request-checks / pre-commit-checks / Pre-commit Checks"
            integration_id: 15368 # GH Actions
          - context: "common-pull-request-checks / semgrep-scan / Semgrep Scan"
            integration_id: 15368 # GH Actions
          - context: "common-pull-request-checks / trivy-scan / Trivy Config Scan"
            integration_id: 15368 # GH Actions
          - context: "common-pull-request-checks / trivy-scan / Trivy FS Scan"
            integration_id: 15368 # GH Actions
          - context: "common-pull-request-checks / validate-pr-title / Validate PR Title"
            integration_id: 15368 # GH Actions
      non_fast_forward: true
      copilot_code_review:
        review_on_push: false
        review_draft_pull_requests: false

  main-tag-protection:
    target: tag
    enforcement: active
    bypass_actors:
      - actor_id: 0
        actor_type: OrganizationAdmin
        bypass_mode: always
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    conditions:
      ref_name:
        include:
          - "~ALL"
        exclude: []
    rules:
      creation: false
      update: true
      deletion: true
      required_linear_history: true
      required_signatures: true
      non_fast_forward: true

  # GitHub auto-creates this ruleset per-repo outside our config.
  # We override it here to disable it.
  Code Quality Copilot review for default branch:
    target: branch
    enforcement: disabled
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      copilot_code_review:
        review_on_push: true
        review_draft_pull_requests: true

labels:
  - name: bug
    color: D73A4A
    description: "Something isn't working"
  - name: dependencies
    color: 0366D6
    description: "Pull requests that update a dependency file"
  - name: documentation
    color: 00EE5A
    description: "Improvements or additions to documentation"
  - name: duplicate
    color: CFD3D7
    description: "This issue or pull request already exists"
  - name: feature
    color: 3DB6D1
    description: "New feature or request"
  - name: no-stale
    color: D93F0B
    description: "This will not be marked as stale"
  - name: security
    color: 6F42C1
    description: "Security related issues or improvements"
  - name: stale
    color: A3053A
    description: "Issue or pull request inactive for a long time"
  - name: "autorelease: pending"
    color: FBCA04
    description: "Automated release in progress"
  - name: "autorelease: tagged"
    color: 0E8A16
    description: "Automated release tagged"
