name: keycloak-oidc-groups-mapper
description: Keycloak custom mapper to map OIDC claims to Keycloak groups
topics:
  - identity-management
  - java
  - keycloak
  - oidc
  - sso
is_template: false
archived: false
template:
  owner: neteye-platform
  repository: default-repository-template
  include_all_branches: false

branch_rulesets:
  main-branch-protection:
    rules:
      required_status_checks:
        required_check:
          - context: "Build"
            integration_id: 15368 # GH Actions

  # Allow only NetEye Steward to tag since the version is bumped
  # inside the pom.xml file and the tag is created by a workflow
  main-tag-protection:
    bypass_actors:
      - actor_id: 3017534 # neteye-steward
        actor_type: Integration
        bypass_mode: always
    rules:
      creation: true
