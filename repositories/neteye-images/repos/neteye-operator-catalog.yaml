name: neteye-operator-catalog
description: NetEye Kubernetes operator Catalog
topics:
  - neteye
  - golang
  - kubernetes
  - kubernetes-operator
  - operator
is_template: false
archived: false
template:
  owner: neteye-platform
  repository: default-repository-template
  include_all_branches: false

branch_rulesets:
  main-branch-protection:
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: false
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: false
      required_status_checks:
        required_check:
          - context: "Build catalog image"
            integration_id: 15368 # GH Actions

  main-pull-request-protection:
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 3017534 # neteye-steward
        actor_type: Integration
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
          - "maint-*"
        exclude: []
    rules:
      pull_request:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        require_last_push_approval: true
        required_review_thread_resolution: true
        allowed_merge_methods:
          - "squash"
