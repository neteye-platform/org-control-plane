name: neteye-operator
description: NetEye Kubernetes operator
topics:
  - neteye
  - golang
  - kubernetes
  - kubernetes-operator
  - operator
is_template: false
archived: false
template:
  owner: neteye-platform
  repository: default-repository-template
  include_all_branches: false

branch_rulesets:
  main-branch-protection:
    conditions:
      ref_name:
        include:
          - "release/*"
    rules:
      required_status_checks:
        required_check:
          - context: "Unit tests"
            integration_id: 15368 # GH Actions
          - context: "Integration tests"
            integration_id: 15368 # GH Actions
          - context: "Build operator image"
            integration_id: 15368 # GH Actions
          - context: "Build bundle image"
            integration_id: 15368 # GH Actions
          - context: "Deepcopy & CRD"
            integration_id: 15368 # GH Actions
          - context: "OLM bundle"
            integration_id: 15368 # GH Actions
          - context: "Helm lint"
            integration_id: 15368 # GH Actions
          - context: "Helm template"
            integration_id: 15368 # GH Actions
