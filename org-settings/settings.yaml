# Organization-wide settings for the GitHub organization.
# billing_email is injected at plan/apply time from the
# TF_VAR_billing_email environment variable.

company: "Würth IT Italy"
blog: "https://neteye.guide"
email: ""
location: "Italy"
name: "NetEye"
description: "NetEye Unified Monitoring Platform"

has_organization_projects: false
